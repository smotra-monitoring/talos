apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-gui
  namespace: longhorn-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: private-gateway
    namespace: ingress-gateways
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: longhorn-frontend
      namespace: longhorn-system
      port: 80
      weight: 1
    matches:
    - path:
        value: /
        type: PathPrefix
