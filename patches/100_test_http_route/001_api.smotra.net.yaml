apiVersion: v1
kind: Namespace
metadata:
  name: smotra-net

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute                                
metadata:
  name: api-smotra-net
  namespace: smotra-net
spec:
  hostnames:
  - api.smotra.net
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: ingress-gateways
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: api-smotra-net
      port: 9080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
