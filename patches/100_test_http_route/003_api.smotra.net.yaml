apiVersion: v1
kind: Namespace
metadata:
  name: test-api-webbites-dev

---
# 2. Create the Nginx Deployment (Single Replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: test-api-webbites-dev
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---
# 3. Create the Service to expose the Deployment
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: test-api-webbites-dev
spec:
  type: ClusterIP # Use 'NodePort' or 'LoadBalancer' if you need external access
  selector:
    app: nginx   # This matches the label on the deployment's pods
  ports:
    - protocol: TCP
      port: 80        # The port the service exposes inside the cluster
      targetPort: 80  # The port the Nginx container is listening on
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute                                
metadata:
  name: api-webbites-dev
  namespace: test-api-webbites-dev
spec:
  hostnames:
  - api.webbites.dev
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
    namespace: ingress-gateways
    sectionName: https
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: nginx-service
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
